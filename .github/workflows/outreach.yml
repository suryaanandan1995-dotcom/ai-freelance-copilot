name: Outreach

# Scheduled auto-email outreach. This is the ONLY auto-send channel and it is
# email-only (sent from your own address; B2B legitimate interest; rate-limited;
# deduped; opt-out footer). Upwork/LinkedIn are NEVER submitted automatically.
#
# IMPORTANT — persistence: dedupe ("never email an address twice") and the daily
# cap live in the OutreachRecord table. GitHub Actions runners are ephemeral, so
# the default SQLite file is thrown away after every run. You MUST point
# COPILOT_DATABASE_URL at a persistent hosted Postgres, otherwise the dedupe
# table resets each run and you could re-email people. If you cannot provide a
# persistent DB, run the schedule on an always-on box with a persistent SQLite
# file instead (see README "Auto-Email Outreach").

on:
  schedule:
    - cron: "0 6 * * 1-5"   # weekdays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  outreach:
    name: Send scheduled outreach
    runs-on: ubuntu-latest
    env:
      COPILOT_ANTHROPIC_API_KEY: ${{ secrets.COPILOT_ANTHROPIC_API_KEY }}
      COPILOT_SMTP_HOST: ${{ secrets.COPILOT_SMTP_HOST }}
      COPILOT_SMTP_USER: ${{ secrets.COPILOT_SMTP_USER }}
      COPILOT_SMTP_PASSWORD: ${{ secrets.COPILOT_SMTP_PASSWORD }}
      COPILOT_AUTO_EMAIL: "true"
      # Adzuna keys for the uk_contract source (developer.adzuna.com, free tier).
      # Actions reads repo SECRETS, never .env — so setting these locally does
      # nothing here, and without them uk_contract logs DISABLED and yields zero.
      # That is the highest-fit source in the mix; the rest are remote job boards
      # whose leads score p50 22 against a bar of 70.
      COPILOT_ADZUNA_APP_ID: ${{ secrets.COPILOT_ADZUNA_APP_ID }}
      COPILOT_ADZUNA_APP_KEY: ${{ secrets.COPILOT_ADZUNA_APP_KEY }}
      # REQUIRED for cross-run dedupe — a persistent hosted Postgres DSN. Without
      # a persistent DATABASE_URL the dedupe table resets each run and could
      # re-email people.
      COPILOT_DATABASE_URL: ${{ secrets.COPILOT_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # psycopg2-binary so a Postgres COPILOT_DATABASE_URL (cross-run dedupe) works;
        # harmless when the DB is SQLite.
        run: pip install -r requirements.txt psycopg2-binary

      - name: Build portfolio knowledge base
        run: python -m scripts.build_kb

      - name: Run outreach pipeline
        run: python main.py run --auto-email --notify

      - name: Read the inbox before nudging anyone
        # MUST run before the follow-up step. Detection is what sets
        # OutreachRecord.replied, and a follow-up is only suppressed for records
        # already marked replied. Nudging in the other order emails people who
        # answered overnight — the single worst-looking failure this system can
        # produce, and one the prospect notices before we do.
        #
        # This sends nothing: COPILOT_AUTO_REPLY is not set here, so the pass runs
        # in detection-only mode (records the inbound, marks the lead replied,
        # honours opt-outs). The separate Auto-Reply workflow does the answering.
        continue-on-error: true
        run: python main.py reply

      - name: Send follow-ups
        # Spaced nudges to prior cold-emailed leads who never replied. Shares the
        # same master gate (COPILOT_AUTO_EMAIL), daily cap, SMTP transport, and
        # suppression list as the initial outreach; no-op if the gate is off.
        # Secondary step — must NOT fail the run: the primary outreach already ran
        # above, so a follow-up hiccup shouldn't mark the pipeline failed.
        continue-on-error: true
        run: python main.py followup
