name: LinkedIn Post

# Scheduled LinkedIn posting — ONE post every weekday. Publishes a fresh,
# RAG-grounded post to the owner's OWN feed via the official LinkedIn Share API
# (w_member_social) — ToS-compliant (original content, own account, official API).
# This is NOT the auto-submit behaviour that gets banned.
#
# FAILURE ALERTS: main.py runs this through record_run("linkedin", ...), which emails
# the owner (SMTP secrets below) and fails the job if a publish errors — so an expired
# access token (~every 60 days) pings you by email instead of silently going dark.
#
# TOKEN ROTATION: when COPILOT_LINKEDIN_ACCESS_TOKEN expires, regenerate it via the
# LinkedIn OAuth 2.0 tools screen and update the repo secret.
#
# Required repo secrets:
#   COPILOT_ANTHROPIC_API_KEY, COPILOT_LINKEDIN_ACCESS_TOKEN, COPILOT_LINKEDIN_AUTHOR_URN
#   COPILOT_SMTP_HOST / COPILOT_SMTP_USER / COPILOT_SMTP_PASSWORD  (for failure alerts)
#   COPILOT_DATABASE_URL  (optional; persistent Postgres for cross-run dedupe)

on:
  schedule:
    # WEEKDAYS, raised from Mon/Wed/Fri on 2026-08-20. Not a guess about what "more
    # engagement" needs: in a month this pipeline sent 23 cold emails for 1 reply and 0
    # calls, while ONE post produced a booked call the next morning. Inbound is the only
    # channel with a result, the topic rotation carries 12 angles so it does not repeat
    # itself, and posting original content to your own feed via the official API is the
    # one thing here with no ToS risk at all. Measured by kpi: calls_inbound vs
    # posts_published — if the rate per post falls, this comes back down.
    - cron: "0 9 * * 1-5"   # Mon-Fri 09:00 UTC
  workflow_dispatch:
    inputs:
      topic:
        description: "Override the auto-rotated topic (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: linkedin
  cancel-in-progress: false

jobs:
  post:
    name: Publish LinkedIn post (weekdays)
    runs-on: ubuntu-latest
    env:
      COPILOT_ANTHROPIC_API_KEY: ${{ secrets.COPILOT_ANTHROPIC_API_KEY }}
      COPILOT_LINKEDIN_AUTO_POST: "true"
      COPILOT_LINKEDIN_ACCESS_TOKEN: ${{ secrets.COPILOT_LINKEDIN_ACCESS_TOKEN }}
      COPILOT_LINKEDIN_AUTHOR_URN: ${{ secrets.COPILOT_LINKEDIN_AUTHOR_URN }}
      COPILOT_DATABASE_URL: ${{ secrets.COPILOT_DATABASE_URL }}
      COPILOT_MAX_POSTS_PER_DAY: "1"
      # SMTP so a failed publish (e.g. expired token) emails the owner an alert.
      COPILOT_SMTP_HOST: ${{ secrets.COPILOT_SMTP_HOST }}
      COPILOT_SMTP_USER: ${{ secrets.COPILOT_SMTP_USER }}
      COPILOT_SMTP_PASSWORD: ${{ secrets.COPILOT_SMTP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt psycopg2-binary

      - name: Build portfolio knowledge base
        run: python -m scripts.build_kb

      # Topic rotation lives in content/topics.py (weighted toward AI-infra, agents
      # and forward-deployed work, which is where UK contract demand is growing).
      # It used to be a bash array here, which meant it was untestable and drifted
      # out of sync with what the lead pipeline targets. An empty --topic
      # auto-rotates by day-of-year; workflow_dispatch can still override it.
      - name: Publish one post (topic rotates each run)
        run: |
          python main.py linkedin-post --kind post \
            --topic "${{ github.event.inputs.topic }}" --publish
