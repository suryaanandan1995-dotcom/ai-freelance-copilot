name: LinkedIn Post

# Scheduled weekly LinkedIn post. Publishes ONE fresh, RAG-grounded post to the
# owner's OWN feed via the official LinkedIn Share API (w_member_social) — which is
# ToS-compliant (original content, own account, official API). This is NOT the
# auto-submit behaviour that gets banned (scraping / bot-submitting to other
# accounts). Content comes from the same content engine used in the dashboard.
#
# IMPORTANT — token rotation: the LinkedIn access token expires (~60 days). When it
# does, this workflow will fail with a 401 until you refresh COPILOT_LINKEDIN_ACCESS_TOKEN
# (regenerate via the LinkedIn OAuth 2.0 tools screen, then update the repo secret).
#
# Required repo secrets:
#   COPILOT_ANTHROPIC_API_KEY     (already set for outreach)
#   COPILOT_LINKEDIN_ACCESS_TOKEN (OAuth token, w_member_social)
#   COPILOT_LINKEDIN_AUTHOR_URN   (urn:li:person:<id>)
#   COPILOT_DATABASE_URL          (optional; persistent Postgres for cross-run dedupe/cap)

on:
  schedule:
    - cron: "0 9 * * 2"   # Tuesdays 09:00 UTC
  workflow_dispatch:
    inputs:
      topic:
        description: "Override the auto-rotated topic (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: linkedin
  cancel-in-progress: false

jobs:
  post:
    name: Publish weekly LinkedIn post
    runs-on: ubuntu-latest
    env:
      COPILOT_ANTHROPIC_API_KEY: ${{ secrets.COPILOT_ANTHROPIC_API_KEY }}
      COPILOT_LINKEDIN_AUTO_POST: "true"
      COPILOT_LINKEDIN_ACCESS_TOKEN: ${{ secrets.COPILOT_LINKEDIN_ACCESS_TOKEN }}
      COPILOT_LINKEDIN_AUTHOR_URN: ${{ secrets.COPILOT_LINKEDIN_AUTHOR_URN }}
      COPILOT_DATABASE_URL: ${{ secrets.COPILOT_DATABASE_URL }}
      COPILOT_MAX_POSTS_PER_DAY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt psycopg2-binary

      - name: Build portfolio knowledge base
        run: python -m scripts.build_kb

      - name: Publish one post (auto-rotated topic)
        run: |
          # Rotate the angle each week so the feed stays varied. A manual
          # workflow_dispatch can override via the `topic` input.
          TOPICS=(
            "shipping AI/LLM workloads securely on Kubernetes"
            "cutting cloud cost without slowing delivery"
            "GitOps multi-environment promotion with ArgoCD"
            "Kubernetes security hardening and policy-as-code"
            "building a DevSecOps CI/CD pipeline with fail-closed vulnerability gates"
            "Terraform multi-cloud platform engineering done right"
          )
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -z "$TOPIC" ]; then
            WEEK=$(date +%V)
            IDX=$(( 10#$WEEK % ${#TOPICS[@]} ))
            TOPIC="${TOPICS[$IDX]}"
          fi
          echo "Topic: $TOPIC"
          python main.py linkedin-post --kind post --topic "$TOPIC" --publish
