name: Health Monitor

# Autonomous health monitor ("doctor"). Runs daily, checks the whole system,
# AUTO-HEALS safe issues (schema drift), and emails the owner a diagnosis for
# anything that needs attention (DB unreachable, LinkedIn token expired, repeated
# run failures). It never edits source code or safety flags.
#
# Required repo secrets:
#   COPILOT_DATABASE_URL, COPILOT_LINKEDIN_ACCESS_TOKEN, COPILOT_LINKEDIN_AUTHOR_URN,
#   COPILOT_SMTP_HOST / COPILOT_SMTP_USER / COPILOT_SMTP_PASSWORD (for the alert email)

on:
  schedule:
    - cron: "30 7 * * *"   # daily 07:30 UTC (after the weekday 06:00 outreach)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Run health monitor
    runs-on: ubuntu-latest
    env:
      COPILOT_DATABASE_URL: ${{ secrets.COPILOT_DATABASE_URL }}
      COPILOT_LINKEDIN_ACCESS_TOKEN: ${{ secrets.COPILOT_LINKEDIN_ACCESS_TOKEN }}
      COPILOT_LINKEDIN_AUTHOR_URN: ${{ secrets.COPILOT_LINKEDIN_AUTHOR_URN }}
      COPILOT_SMTP_HOST: ${{ secrets.COPILOT_SMTP_HOST }}
      COPILOT_SMTP_USER: ${{ secrets.COPILOT_SMTP_USER }}
      COPILOT_SMTP_PASSWORD: ${{ secrets.COPILOT_SMTP_PASSWORD }}
      # Optional. Blank is normal: config.Settings.resolved_imap_host() derives the
      # IMAP host from COPILOT_SMTP_HOST. Set this only for a provider whose IMAP
      # server is not the SMTP host with the leading label swapped. The imap_login
      # check logs in for real, so a wrong value is reported the next morning.
      COPILOT_IMAP_HOST: ${{ secrets.COPILOT_IMAP_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt psycopg2-binary

      - name: Run health monitor
        run: python main.py doctor

      # The reply workflow already sweeps for bookings, but only on weekdays 08:00-18:00.
      # Someone booking on a Saturday for a Monday 09:00 call would be briefed after the
      # call had already started. This daily 07:30 pass closes that gap.
      #
      # `if: always()` because a booked call is worth more than a clean monitor run: the
      # doctor exits non-zero only when the monitor itself crashed, and that must not be
      # the reason the owner walks into a call unprepared.
      - name: Detect booked calls and brief the owner
        if: always()
        run: python main.py calls
